# Publishes the website to GitHub Pages: site/ (the landing page), plus the latest release's
# downloads and the Sparkle update feed, which scripts/assemble-site.py makes from the GitHub
# releases. Runs on pushes to main that change the site, after every release (release.yml starts
# it) and on demand.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/tests/**"
      - "scripts/assemble-site.py"
      - ".github/workflows/pages.yml"
  # release.yml dispatches it on the default branch: a deployment from a tag (as a reusable
  # workflow called by release.yml would be) is refused by the github-pages environment.
  workflow_dispatch:

permissions:
  contents: read # also lets gh read the releases of this private repository
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Check the page before deploying
        run: python3 scripts/test-site.py
      - name: Add the downloads and the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/assemble-site.py "$RUNNER_TEMP/site" --base-url "$BASE_URL"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
