# Publishes the website to GitHub Pages: site/ (the landing page), plus the latest release's
# downloads and the Sparkle update feed, which scripts/assemble-site.py makes from the GitHub
# releases. Runs on pushes to main that change the site, after every release (release.yml starts
# it) and on demand.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/tests/**"
      - "scripts/assemble-site.py"
      - ".github/workflows/pages.yml"
  # release.yml dispatches it on the default branch: a deployment from a tag (as a reusable
  # workflow called by release.yml would be) is refused by the github-pages environment.
  workflow_dispatch:

permissions:
  contents: read # also lets gh read the releases of this private repository
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deployment that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Check the page before deploying
        run: python3 scripts/test-site.py
      - name: Add the downloads and the update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/assemble-site.py "$RUNNER_TEMP/site" --base-url "$BASE_URL"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
