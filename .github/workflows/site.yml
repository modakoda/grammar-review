# Tests the landing page on every change to it: structure and facts without a browser
# (scripts/test-site.py), then the demos and the download states in headless Chromium at desktop
# and phone widths (site/tests, Playwright). pages.yml runs the first part again before deploying.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/test-site.py"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "scripts/test-site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/tests/package-lock.json
      - name: Structure, links and facts
        run: python3 scripts/test-site.py
      - name: Install Playwright
        working-directory: site/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: site/tests
        run: npx playwright test
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-test-results
          path: |
            site/tests/test-results
            site/tests/playwright-report
          if-no-files-found: ignore
          retention-days: 14
